<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CCMC Minecraft伺服器快速加入</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background-color: #121214;
            color: #e1e1e6;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        .container {
            background-color: #202024;
            padding: 40px;
            border-radius: 16px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.5);
            text-align: center;
            max-width: 450px;
            width: 100%;
            border: 1px solid #323238;
        }
        h1 {
            font-size: 24px;
            margin-bottom: 12px;
            color: #00b37e;
        }
        p {
            font-size: 14px;
            color: #a8a8b3;
            margin-bottom: 32px;
            line-height: 1.6;
        }
        .btn-group {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }
        .btn {
            display: block;
            width: 100%;
            padding: 14px 20px;
            font-size: 16px;
            font-weight: bold;
            text-decoration: none;
            text-align: center;
            border-radius: 8px;
            transition: background-color 0.2s, transform 0.1s;
            cursor: pointer;
        }
        .btn-primary {
            background-color: #00b37e;
            color: #fff;
        }
        .btn-primary:hover {
            background-color: #008f63;
        }
        .btn-secondary {
            background-color: #29292e;
            color: #00b37e;
            border: 2px solid #00b37e;
        }
        .btn-secondary:hover {
            background-color: #323238;
        }
        .btn:active {
            transform: scale(0.98);
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>CCMC CandyCrashMc 加入伺服器</h1>
        <p>點擊下方按鈕可自動開啟 Minecraft 基岩版並加入伺服器！</p>
        <div class="btn-group">
            <a href="minecraft://?addExternalServer=CCMC Main主要|server.ccmc.dpdns.org:19132" class="btn btn-primary">
                加入主要伺服器
            </a>
            <a href="minecraft://?addExternalServer=CCMC BackUp備用|144.31.46.9:10425" class="btn btn-secondary">
                加入備用伺服器
            </a>
        </div>
    </div>
</body>
</html>
